name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Syntax check
        run: python -m py_compile server.py

  notify-webhook:
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: Hakanai-AI/.github/.github/actions/notify-webhook@main
        with:
          status: ${{ needs.lint.result }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
